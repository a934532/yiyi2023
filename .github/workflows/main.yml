name: 48H_Coin_Monitor

on:
  schedule:
    # 改成每 15 分鐘執行一次
    - cron: '*/15 * * * *'  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests beautifulsoup4; fi

      - name: Run Monitoring Script
        run: |
          export TZ='Asia/Taipei'
          python rsi_monitor.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Commit and Push History
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          if [ -f notify_history.json ]; then
            git add notify_history.json
            git commit -m "Update history [skip ci]" || echo "No changes"
            git push
          fi
