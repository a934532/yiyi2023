      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # --- 這是你漏掉的步驟 ---
      - name: Install dependencies
        run: |
          pip install telethon requests
          # 如果你的程式還有用到其他套件，也請寫在這邊

      - name: Run Script
        run: python rsi_monitor.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
